name: sync

# Regenerates the generated client artifacts (skills/webacy/SKILL.md, AGENTS.md)
# from the live Webacy MCP tool list. Requires a repository secret WEBACY_API_KEY.

on:
  schedule:
    - cron: "0 6 * * 1" # weekly, Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # don't leave the write-capable github.token in git config for the
          # npm/node steps to read; create-pull-request uses its own token.
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - name: Regenerate artifacts
        run: node scripts/build.mjs
        env:
          WEBACY_API_KEY: ${{ secrets.WEBACY_API_KEY }}
      - name: Open PR on drift
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          title: "chore: sync Webacy tools + regenerate client artifacts"
          commit-message: "chore: sync Webacy tools + regenerate client artifacts"
          branch: chore/sync-webacy-tools
          body: |
            Automated regeneration of the generated client artifacts from the live
            Webacy MCP tool list (`api.webacy.com/mcp`).

            Requires the `WEBACY_API_KEY` repository secret.
