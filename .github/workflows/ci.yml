name: CI

# Runs the tests and builds (and validates) the ChatGPT plugin ZIP on every PR.
# No secrets: the plugin build reads only committed files.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - name: Build and validate the ChatGPT plugin
        run: npm run build:chatgpt-plugin
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: webacy-chatgpt-plugin
          path: dist/webacy-chatgpt-plugin.zip
          if-no-files-found: error
